<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Table</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }

        td {
            width: 50%;
            padding: 20px;
            font-family: sans-serif;
            font-size: 18px;
            border: 1px solid #777;
            box-sizing: border-box;
        }

        .cell-1 {
            background-color: #c0ca55;
        }

        .cell-2 {
            background-color: #f7c5b3;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="cell-1">First cell</td>
            <td class="cell-2">Second cell</td>
        </tr>
    </table>

</body>
</html>
