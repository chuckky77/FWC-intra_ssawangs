<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex02bis</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div>
        <input type="text" id="left">
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>
        <input type="text" id="right">
        <input type="submit" id="btn" value="Try me!">
    </div>

    <script>
        $(document).ready(function() {
            function isPositiveInteger(str) {
                return /^\d+$/.test(str.trim());
            }

            $('#btn').click(function() {
                const leftVal = $('#left').val();
                const rightVal = $('#right').val();

                if (!isPositiveInteger(leftVal) || !isPositiveInteger(rightVal)) {
                    alert('Error :(');
                    return;
                }

                const num1 = parseInt(leftVal, 10);
                const num2 = parseInt(rightVal, 10);
                const op = $('#operator').val();

                if ((op === '/' || op === '%') && num2 === 0) {
                    alert("It's over 9000!");
                    console.log("It's over 9000!");
                    return;
                }

                let result = 0;
                switch (op) {
                    case '+': result = num1 + num2; break;
                    case '-': result = num1 - num2; break;
                    case '*': result = num1 * num2; break;
                    case '/': result = num1 / num2; break;
                    case '%': result = num1 % num2; break;
                }

                alert(result);
                console.log(result);
            });

            setInterval(function() {
                alert('Please, use me...');
            }, 30000);
        });
    </script>
</body>
</html>
