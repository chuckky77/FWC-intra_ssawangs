<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <h1>User Profile Card</h1>

    <!-- Invisible Table สำหรับจัดโครงสร้างการวางตำแหน่ง -->
    <table class="card-table">
        <tr>
            <td>
                <img src="https://picsum.photos/id/237/400/300" alt="Profile Picture" class="profile-img">
            </td>
        </tr>
        <tr>
            <td>
                <div class="login-name">sswangs</div>
                <div class="description">Hello World</div>
                <div class="location">42 Bangkok</div>
                <div class="social-icons">
                    <span>🌐</span>
                    <span>🐦</span>
                    <span>in</span>
                    <span>f</span>
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <button class="contact-btn">Contact</button>
            </td>
        </tr>
    </table>

</body>
</html>
